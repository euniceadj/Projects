<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eunice — Projects</title>
<meta name="description" content="Eunice Adjei — cybersecurity projects, labs, and coursework.">
<style>
:root {
  --accent: #228B22; --accent-soft: #DCEEDD; --accent-ink: #155515;
  --bg: #ffffff; --bg-2: oklch(0.955 0.020 150); --bg-3: oklch(0.935 0.032 150); --bg-4: oklch(0.910 0.044 152);
  --ink: oklch(0.18 0.010 145); --ink-2: oklch(0.36 0.010 145); --muted: oklch(0.50 0.012 145);
  --line: oklch(0.86 0.018 145); --line-2: oklch(0.91 0.014 145);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  --font-serif: Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --scale: 1; --rail-w: 210px;
  --pad-x: clamp(24px, 5vw, 64px); --pad-y: clamp(80px, 11vw, 140px); --max-w: 980px;
  --radius: 14px; --t: 220ms cubic-bezier(.2,.7,.2,1);
}
[data-dark="true"] {
  --bg: oklch(0.155 0.012 150); --bg-2: oklch(0.195 0.014 150); --bg-3: oklch(0.225 0.018 150); --bg-4: oklch(0.255 0.022 150);
  --ink: oklch(0.96 0.006 130); --ink-2: oklch(0.82 0.008 130); --muted: oklch(0.62 0.010 145);
  --line: oklch(0.28 0.012 150); --line-2: oklch(0.235 0.012 150); --accent-soft: oklch(0.26 0.05 150);
}
[data-accent="forest"]  { --accent: #228B22; --accent-ink: #155515; --accent-soft: #DCEEDD; }
[data-accent="mint"]    { --accent: oklch(0.62 0.15 160); --accent-ink: oklch(0.38 0.10 160); --accent-soft: oklch(0.92 0.05 160); }
[data-accent="moss"]    { --accent: oklch(0.52 0.08 130); --accent-ink: oklch(0.32 0.06 130); --accent-soft: oklch(0.93 0.03 130); }
[data-accent="ocean"]   { --accent: oklch(0.48 0.12 230); --accent-ink: oklch(0.32 0.09 230); --accent-soft: oklch(0.93 0.04 230); }
[data-dark="true"][data-accent="forest"] { --accent: oklch(0.76 0.12 150); --accent-soft: oklch(0.28 0.05 150); }
[data-dark="true"][data-accent="mint"]   { --accent: oklch(0.82 0.16 160); --accent-soft: oklch(0.28 0.06 160); }
[data-dark="true"][data-accent="moss"]   { --accent: oklch(0.74 0.10 130); --accent-soft: oklch(0.28 0.05 130); }
[data-dark="true"][data-accent="ocean"]  { --accent: oklch(0.74 0.13 230); --accent-soft: oklch(0.28 0.06 230); }

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: calc(20px * var(--scale)); line-height: 1.55; -webkit-font-smoothing: antialiased; transition: background var(--t), color var(--t); }
::selection { background: var(--accent); color: var(--bg); }
a { color: inherit; text-decoration: none; }

.page { display: grid; grid-template-columns: var(--rail-w) 1fr; max-width: var(--max-w); margin: 0 auto; padding: 0 var(--pad-x); min-height: 100vh; }
@media (max-width: 880px) { .page { grid-template-columns: 1fr; } }

.rail { position: sticky; top: 0; align-self: start; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 32px 0; margin-left: clamp(-56px, -3.5vw, -20px); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; }
@media (max-width: 880px) { .rail { position: sticky; top: 0; z-index: 5; background: color-mix(in oklch, var(--bg), transparent 8%); backdrop-filter: blur(10px); height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding: 14px var(--pad-x); margin: 0 calc(-1 * var(--pad-x)); border-bottom: 1px solid var(--line); } }

.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.brand .dot { width: 10px; height: 10px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px var(--accent-soft); } 50% { box-shadow: 0 0 0 6px transparent; } }

.rail__nav { display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 880px) { .rail__nav { display: none; } }
.rail__nav a { display: flex; align-items: center; gap: 12px; padding: 6px 0; font-size: 15px; color: var(--muted); transition: color var(--t); text-transform: lowercase; }
.rail__nav a::before { content: ""; width: 16px; height: 1px; background: currentColor; transition: width var(--t), background var(--t); }
.rail__nav a:hover { color: var(--ink); }
.rail__nav a.is-active { color: var(--accent); }
.rail__nav a.is-active::before { width: 32px; background: var(--accent); }

.rail__foot { display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 880px) { .rail__foot { flex-direction: row; gap: 10px; } }
.theme-toggle { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--line); color: var(--ink-2); padding: 7px 12px; border-radius: 999px; cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; transition: border-color var(--t), color var(--t); }
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
.theme-toggle .glyph { display: inline-block; width: 12px; height: 12px; position: relative; }
.theme-toggle .glyph::before { content: ""; position: absolute; inset: 0; border-radius: 999px; background: currentColor; transform: scale(0.55); transition: clip-path var(--t); }
[data-dark="true"] .theme-toggle .glyph::before { clip-path: circle(50% at 30% 50%); transform: scale(0.62); }

.main { min-width: 0; padding-left: clamp(0px, 4vw, 80px); }
@media (max-width: 880px) { .main { padding-left: 0; padding-top: 20px; } }

.projects-header { padding-top: var(--pad-y); padding-bottom: clamp(40px, 6vw, 72px); }
.projects-header__back { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 32px; transition: color var(--t); }
.projects-header__back:hover { color: var(--accent); }
.projects-header__back::before { content: ""; display: inline-block; width: 20px; height: 1px; background: currentColor; transition: width var(--t); }
.projects-header__back:hover::before { width: 28px; }
.projects-header h1 { font-size: clamp(36px, 6vw, 64px); font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 16px; }
.projects-header h1 em { font-style: italic; font-family: var(--font-serif); color: var(--accent); }
.projects-header__sub { font-size: clamp(14px, 1.8vw, 17px); color: var(--muted); max-width: 480px; margin: 0; font-family: var(--font-mono); letter-spacing: 0.01em; }

.filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: clamp(32px, 5vw, 56px); padding-bottom: 20px; border-bottom: 1px solid var(--line-2); }
.filter-bar__label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; margin-right: 4px; }
.filter-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 5px 13px; border-radius: 999px; cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; transition: border-color var(--t), color var(--t), background var(--t); }
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.is-active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

.projects-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: var(--pad-y); }

.skeleton { background: var(--bg-2); border-radius: var(--radius); border: 1px solid var(--line-2); padding: clamp(24px, 4vw, 40px); animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.skeleton__line { background: var(--bg-4); border-radius: 4px; height: 14px; margin-bottom: 12px; }
.skeleton__line--short { width: 35%; }
.skeleton__line--med   { width: 60%; }
.skeleton__line--long  { width: 90%; }
.skeleton__title { background: var(--bg-4); border-radius: 6px; height: 28px; width: 70%; margin: 16px 0 12px; }

.project-card { background: var(--bg-2); border-radius: var(--radius); border: 1px solid var(--line-2); overflow: hidden; transition: background var(--t), transform var(--t); cursor: pointer; }
.project-card:hover { background: var(--bg-3); transform: translateY(-1px); }
.project-card__inner { padding: clamp(24px, 4vw, 40px); }
.project-card__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.project-card__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.project-card__type { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; }
.project-card__course { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: var(--muted); }
.project-card__status { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: var(--muted); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; }
.project-card__arrow { font-size: 18px; color: var(--muted); transition: color var(--t), transform var(--t); flex-shrink: 0; line-height: 1; }
.project-card:hover .project-card__arrow { color: var(--accent); transform: translateX(3px); }
.project-card h2 { font-size: clamp(18px, 2.4vw, 23px); font-weight: 500; letter-spacing: -0.01em; margin: 0 0 10px; line-height: 1.2; }
.project-card__desc { font-size: clamp(13px, 1.4vw, 15px); color: var(--ink-2); line-height: 1.6; margin: 0 0 20px; max-width: 580px; }
.project-card__tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.03em; color: var(--muted); background: var(--bg-4); padding: 4px 10px; border-radius: 6px; }

.status-msg { padding: clamp(48px, 8vw, 96px) 0; font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.04em; color: var(--muted); display: none; }
.status-msg.is-visible { display: block; }
</style>
</head>
<body>
<div class="page" id="top">
  <aside class="rail">
    <div>
      <a href="index.html" class="brand">
        <span class="dot" aria-hidden="true"></span>
        <span style="font-size:15px">Eunice Adjei</span>
      </a>
    </div>
    <nav class="rail__nav" aria-label="Page">
      <a href="index.html">home</a>
      <a href="projects.html" class="is-active">projects</a>
    </nav>
    <div class="rail__foot">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
        <span class="glyph" aria-hidden="true"></span>
        <span id="themeLabel">dark</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="projects-header">
      <a href="index.html" class="projects-header__back">back to home</a>
      <h1>Projects <em>&amp; labs.</em></h1>
      <p class="projects-header__sub">Coursework, hands-on labs, and independent builds.</p>
    </header>

    <div class="filter-bar">
      <span class="filter-bar__label">filter</span>
      <button class="filter-btn is-active" data-filter="all">all</button>
      <button class="filter-btn" data-filter="network">network</button>
      <button class="filter-btn" data-filter="security">security</button>
      <button class="filter-btn" data-filter="lab">lab</button>
    </div>

    <div class="projects-grid" id="projectsGrid"></div>
    <p class="status-msg" id="emptyMsg">no projects match that filter yet.</p>
    <p class="status-msg" id="errorMsg">couldn't load projects — check back shortly.</p>
  </main>
</div>

<script>
  /* ── Theme ── */
  const DEFAULTS = { accent: "moss", darkMode: true };
  function loadPrefs() {
    try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('eunice.prefs') || 'null')); }
    catch(e) { return Object.assign({}, DEFAULTS); }
  }
  function savePrefs(p) { try { localStorage.setItem('eunice.prefs', JSON.stringify(p)); } catch(e) {} }
  function applyTheme(p) {
    document.documentElement.dataset.accent = p.accent;
    document.documentElement.dataset.dark = p.darkMode ? "true" : "false";
    document.getElementById('themeLabel').textContent = p.darkMode ? "dark" : "light";
  }
  let prefs = loadPrefs();
  applyTheme(prefs);
  document.getElementById('themeToggle').addEventListener('click', function() {
    prefs.darkMode = !prefs.darkMode;
    applyTheme(prefs);
    savePrefs(prefs);
  });

  /* ── Config: add new project folder names here when you add a project ── */
  const PROJECT_FOLDERS = [
    "E-MAGINE"
  ];

  const API_BASE = "https://api.github.com/repos/euniceadj/Projects/contents";

  async function fetchMeta(folder) {
    const res = await fetch(`${API_BASE}/${folder}/meta.json`);
    if (!res.ok) throw new Error(`meta.json not found in ${folder}`);
    const data = await res.json();
    return JSON.parse(atob(data.content.replace(/\n/g, '')));
  }

  function renderSkeletons(n) {
    const grid = document.getElementById('projectsGrid');
    for (let i = 0; i < n; i++) {
      grid.innerHTML += `<div class="skeleton"><div class="skeleton__line skeleton__line--short"></div><div class="skeleton__title"></div><div class="skeleton__line skeleton__line--long"></div><div class="skeleton__line skeleton__line--med"></div></div>`;
    }
  }

  function renderCard(meta) {
    const tags = (meta.tags || []).join(',');
    const displayTags = (meta.tags_display || []).map(t => `<span class="tag">${t}</span>`).join('');
    return `
      <article class="project-card" data-tags="${tags}" onclick="window.location='${meta.page}'">
        <div class="project-card__inner">
          <div class="project-card__top">
            <div class="project-card__meta">
              <span class="project-card__type">${meta.type || 'project'}</span>
              ${meta.course ? `<span class="project-card__course">${meta.course}</span>` : ''}
              <span class="project-card__status">${meta.status || 'in progress'}</span>
            </div>
            <span class="project-card__arrow" aria-hidden="true">&#8594;</span>
          </div>
          <h2>${meta.title}</h2>
          <p class="project-card__desc">${meta.description}</p>
          <div class="project-card__tags">${displayTags}</div>
        </div>
      </article>`;
  }

  async function loadProjects() {
    const grid = document.getElementById('projectsGrid');
    renderSkeletons(PROJECT_FOLDERS.length);
    const results = await Promise.allSettled(PROJECT_FOLDERS.map(fetchMeta));
    grid.innerHTML = '';
    let loaded = 0;
    results.forEach(result => {
      if (result.status === 'fulfilled') { grid.innerHTML += renderCard(result.value); loaded++; }
    });
    if (loaded === 0) document.getElementById('errorMsg').classList.add('is-visible');
    setupFilters();
  }

  function setupFilters() {
    const btns = document.querySelectorAll('.filter-btn');
    const emptyMsg = document.getElementById('emptyMsg');
    btns.forEach(btn => {
      btn.addEventListener('click', function() {
        btns.forEach(b => b.classList.remove('is-active'));
        this.classList.add('is-active');
        const filter = this.dataset.filter;
        let visible = 0;
        document.querySelectorAll('.project-card').forEach(card => {
          const show = filter === 'all' || (card.dataset.tags || '').split(',').includes(filter);
          card.style.display = show ? '' : 'none';
          if (show) visible++;
        });
        emptyMsg.classList.toggle('is-visible', visible === 0);
      });
    });
  }

  loadProjects();
</script>
</body>
</html>
